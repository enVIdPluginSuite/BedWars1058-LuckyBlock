# ---------------------------------------------------------------------------
# BedWars1058-LuckyBlock
# Change settings in game with /bwlb config, or edit this file and run /bwlb reload.
# ---------------------------------------------------------------------------

# Arena groups (BedWars1058) that get lucky blocks automatically.
# Every arena in one of these groups gets lucky block generators on its team islands and at its
# diamond and emerald generators, with no setup needed.
# Easiest: /bwlb group add <group>    (BedWars1058: /bw arenaGroup create <group>, /bw arenaGroup set <arena> <group>)
groups:
  - LuckyBlocks

# How many lucky blocks of one generator can lie around uncollected before it pauses.
generator-limit: 10

# Stop a team's lucky block generator once the whole team is eliminated.
do-not-spawn-if-team-dead: true

# Lucky blocks follow the upgrades of the real generator next to them: when the BedWars1058 generator
# gets faster (forge, diamond/emerald tiers), the lucky blocks come faster by the same percentage.
sync-upgrades: true

# The closer a generator is to the middle of the map, the better its lucky blocks. At the exact middle
# there is this % chance that a lucky block is upgraded one rarity (Rare becomes Legendary...); it fades to 0
# at the edge of the map. 0 = off.
middle-upgrade: 30

# What each kind of generator does:
#   enabled   turn this kind of generator on/off
#   cooldown  seconds between lucky blocks while the real generator runs at its starting speed
generators:
  team:
    enabled: true
    cooldown: 20
  diamond:
    enabled: true
    cooldown: 30
  emerald:
    enabled: true
    cooldown: 45

# The text above every lucky block generator: the real generator's timer and the next lucky block with its rarity.
#   height-team  height above a team generator
#   height-ore   height above a diamond/emerald generator (above BedWars1058's own hologram)
hologram:
  enabled: true
  height-team: 2.4
  height-ore: 3.8

# The name of a lucky block item. {rarity} becomes the rarity name below.
lucky-block-name: "{rarity} &fLucky Block"

# The four rarities: the name shown on the item, and the lucky block colors (names from textures.yml)
# that have this rarity. A color listed in several counts as the best of them.
rarities:
  common:
    name: "&7Common"
    textures: [white, light_gray, gray, brown, black]
  uncommon:
    name: "&aUncommon"
    textures: [green, lime, yellow]
  rare:
    name: "&9Rare"
    textures: [light_blue, cyan, blue, purple, magenta]
  legendary:
    name: "&6&lLegendary"
    textures: [orange, red, pink]

# When a generator makes a lucky block, it rolls the rarity with these chances (percent; they are
# scaled to add up to 100). Emerald generators are in the middle of the map, so they roll better rarities.
rarity-chances:
  team:    { common: 70, uncommon: 24, rare: 5,  legendary: 1 }
  diamond: { common: 25, uncommon: 45, rare: 25, legendary: 5 }
  emerald: { common: 5,  uncommon: 25, rare: 45, legendary: 25 }

# Loot: how likely each drop is out of a lucky block of each rarity. A drop with weight 20 comes up twice as
# often as one with weight 10; 0 or not listed means never. Run /bwlb loot <rarity> to see the percentages.

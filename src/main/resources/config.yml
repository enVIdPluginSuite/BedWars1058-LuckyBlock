# ---------------------------------------------------------------------------
# BedWars1058-LuckyBlock
# Change settings in game with /bwlb config, or edit this file and run /bwlb reload.
# ---------------------------------------------------------------------------

# Arena groups (BedWars1058) that get lucky blocks automatically.
# Every arena in one of these groups gets lucky block generators on its team islands and at its
# diamond and emerald generators, with no setup needed.
# Easiest: /bwlb group add <group>    (BedWars1058: /bw arenaGroup create <group>, /bw arenaGroup set <arena> <group>)
groups:
  - LuckyBlocks

# How many lucky blocks of one generator can lie around uncollected before it pauses.
generator-limit: 10

# Stop a team's lucky block generator once the whole team is eliminated.
do-not-spawn-if-team-dead: true

# Lucky blocks follow the upgrades of the real generator next to them: when the BedWars1058 generator
# gets faster (forge, diamond/emerald tiers), the lucky blocks come faster by the same percentage.
sync-upgrades: true

# The closer a generator is to the middle of the map, the better its lucky blocks. At the exact middle
# there is this % chance that a lucky block is upgraded one rarity (Fortunate becomes Offensive...); it fades to 0
# at the edge of the map. 0 = off.
middle-upgrade: 30

# What each kind of generator does:
#   enabled   turn this kind of generator on/off
#   cooldown  seconds between lucky blocks while the real generator runs at its starting speed
generators:
  team:
    enabled: true
    cooldown: 20
  diamond:
    enabled: true
    cooldown: 30
  emerald:
    enabled: true
    cooldown: 45

# The text above every lucky block generator: the real generator's timer and the next lucky block with its rarity.
#   height-team  height above a team generator
#   height-ore   height above a diamond/emerald generator (above BedWars1058's own hologram)
hologram:
  enabled: true
  height-team: 2.4
  height-ore: 3.8

# The name of a lucky block item. {rarity} becomes the rarity name below.
lucky-block-name: "{rarity} &fLucky Block"

# The five rarities (the lucky block types of Hypixel Bed Wars): the name shown on the item, and the lucky block
# colors (names from textures.yml) that have this rarity. A color listed in several counts as the best of them.
rarities:
  normal:
    name: "&7Normal"
    textures: [white, light_gray, gray, brown, black]
  promising:
    name: "&aPromising"
    textures: [green, lime, yellow]
  fortunate:
    name: "&9Fortunate"
    textures: [light_blue, cyan, blue]
  offensive:
    name: "&c&lOffensive"
    textures: [orange, red, pink]
  miracle:
    name: "&6&lMiracle"
    textures: [purple, magenta]

# When a generator makes a lucky block, it rolls the rarity with these weights (they are scaled to add up
# to 100). Team generators only make Normal and Promising, diamond generators up to Fortunate, and ONLY emerald
# generators make Offensive and Miracle lucky blocks. The middle-of-the-map upgrade never goes past what a
# generator kind can make.
rarity-chances:
  team:    { normal: 80, promising: 20, fortunate: 0,  offensive: 0,  miracle: 0 }
  diamond: { normal: 5,  promising: 45, fortunate: 50, offensive: 0,  miracle: 0 }
  emerald: { normal: 0,  promising: 10, fortunate: 40, offensive: 25, miracle: 25 }

# Loot: how likely each drop is out of a lucky block of each rarity. A drop with weight 20 comes up twice as
# often as one with weight 10; 0 or not listed means never. Run /bwlb loot <rarity> to see the percentages.
# The drops are those of Hypixel Bed Wars. Older drops of this plugin still exist and can be put back in
# a table: arrows bow_set bridge_egg chainmail_armor clay creeper_spawn diamond_armor diamond_armor_prot
#   diamond_pickaxe diamond_sword diamonds emeralds enchanted_golden_apple ender_pearl fire_bow fireball
#   ghast_spawn glass gold_ingots golden_apple healing_totem ice_bridge inventory_copier invisibility_potion
#   iron_armor iron_axe iron_ingots iron_pickaxe iron_sword jump_feather jump_potion knockback_stick ladders
#   lava_bucket lightning_scroll milk_bucket obsidian op_cookie op_sword player_launcher rainbow_wool regen_potion
#   sharp_sword shears sleeping_dust slime_block speed_potion sponge stone_sword strength_potion super_punch_bow
#   swap_scroll tnt tnt_rain water_bucket wolf_pack wood_planks wool

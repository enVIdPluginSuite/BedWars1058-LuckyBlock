# ---------------------------------------------------------------------------
# LuckyBlocks
# ---------------------------------------------------------------------------

# Arena groups (BedWars1058) that get lucky blocks automatically.
# Every arena in one of these groups gets lucky block generators on its team islands and at its
# diamond and emerald generators, with no setup needed.
#
# To make a lucky block group in BedWars1058:
#   /bw arenaGroup create <group>
#   /bw arenaGroup set <arena> <group>
groups:
  - LuckyBlocks

# How many lucky blocks of one generator can lie around uncollected before it pauses.
generator-limit: 10

# Stop a team's lucky block generator once the whole team is eliminated.
do-not-spawn-if-team-dead: true

# What each kind of generator spawns:
#   enabled   turn this kind of generator on/off
#   cooldown  seconds between lucky blocks
#   textures  which lucky block colors it can spawn (the names from textures.yml)
generators:
  team:
    enabled: true
    cooldown: 40
    textures:
      - white
      - light_gray
      - gray
      - brown
      - black
  diamond:
    enabled: true
    cooldown: 60
    textures:
      - light_blue
      - cyan
      - blue
      - purple
      - magenta
  emerald:
    enabled: true
    cooldown: 90
    textures:
      - green
      - lime
      - yellow
      - orange
      - red
      - pink

# Loot: how likely each drop is out of a lucky block of each tier. A drop with weight 20 comes up twice
# as often as one with weight 10, and 0 means never. Run /luckyblock loot to see the resulting percentages.
#
# A lucky block's tier comes from its color: a color listed under generators.diamond.textures above is
# a diamond block, under generators.emerald.textures an emerald block. A color listed in several counts
# as the best of them, and a color listed nowhere counts as a team block.
loot:
  wool:             { team: 30, diamond: 10, emerald: 5 }   # 64 wool in your team's color
  rainbow_wool:     { team: 15, diamond: 8,  emerald: 5 }
  tnt:              { team: 15, diamond: 15, emerald: 12 }
  fireball:         { team: 12, diamond: 14, emerald: 12 }
  bridge_egg:       { team: 12, diamond: 12, emerald: 10 }
  ice_bridge:       { team: 8,  diamond: 10, emerald: 10 }
  sleeping_dust:    { team: 8,  diamond: 12, emerald: 12 }
  player_launcher:  { team: 5,  diamond: 10, emerald: 12 }
  inventory_copier: { team: 3,  diamond: 8,  emerald: 12 }
  lightning_scroll: { team: 3,  diamond: 8,  emerald: 12 }
